<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Fremer Tours</title>
  <link rel="stylesheet" href="styles/base.css">
  <script type="module" src="scripts/main.js"></script>
</head>

<body>
  <header>
    <div class="brand">
      <img src="images/logo.png" alt="Fremer logo " width="50">
      <p>Fremer Tours And Travel</p>
    </div>
    <nav>
      <button id="menu-toggle" aria-label="Open Menu">☰</button>
      <ul id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="packages.html">Packages</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Contact Us</h1>
    <form action="#" method="post">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>

      <label for="phone">Phone:</label>Add commentMore actions
      <input type="tel" id="phone" name="phone" required pattern="[0-9]{10}"
        title="Please enter a valid 10-digit phone number">

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit" class="btn">SEND</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Fremer Tours and Travel |
      <a href="attributions.html">Attributions</a> |
      <a href="https://youtu.be/aerLUzcfrus?si=2vPar67asbPvvYrt" target="_blank">Project Demo</a>
    </p>
  </footer>
</body>

</html>
